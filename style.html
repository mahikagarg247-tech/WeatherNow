<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather App</title>
    <link rel="stylesheet" href="style.css" />
</head>

<body>

    <div class="container">
        <div class="card">


            <div class="search">
                <input type="text" placeholder="Search City" />
            </div>


            <div class="city">
                <span>📍 Jakarta</span>
                <span>Wed, 07 Aug</span>
            </div>


            <div class="weather">
                <div class="icon">☁️</div>
                <div class="temp">29°C</div>
                <div class="desc">Clouds</div>
            </div>


            <div class="info">
                <div>
                    <p>Humidity</p>
                    <h3>55%</h3>
                </div>
                <div>
                    <p>Wind Speed</p>
                    <h3>2 m/s</h3>
                </div>
            </div>


            <div class="forecast">
                <div class="item">
                    <p>05 Aug</p>
                    <span>🌧️</span>
                    <h4>29°C</h4>
                </div>
                <div class="item">
                    <p>05 Aug</p>
                    <span>🌧️</span>
                    <h4>29°C</h4>
                </div>
                <div class="item">
                    <p>05 Aug</p>
                    <span>🌧️</span>
                    <h4>29°C</h4>
                </div>
            </div>

        </div>
    </div>

</body>

</html>
